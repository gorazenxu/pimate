<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Pimate running inside Obsidian</title>
  <desc id="desc">A faithful interface map based on the current Pimate Obsidian view: vault explorer, active note, Pimate history scopes, conversation actions, session tabs, and the dual-engine composer.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#25233a" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f5f6f8}.window{fill:#fbfbfc;stroke:#dfe1e7;stroke-width:2}.chrome{fill:#f1f2f5;stroke:#e1e3e8;stroke-width:1}.rail{fill:#f4f5f7;stroke:#e1e3e8;stroke-width:1}.pane{fill:#fff;stroke:#e3e5ea;stroke-width:1}.subtle{fill:#f8f8fa;stroke:#e5e6eb;stroke-width:1}.active{fill:#f0ebff;stroke:#966cff;stroke-width:2}.divider{stroke:#e5e6eb;stroke-width:1}.text{fill:#272832;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.muted{fill:#70727d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.brand{fill:#d97858;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:700}.accent{fill:#8a63ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.small{font-size:15px}.body{font-size:17px}.label{font-size:18px;font-weight:600}.title{font-size:24px;font-weight:700}.tiny{font-size:12px}.line{stroke:#9b9da7;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.icon{stroke:#6f717b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.action{fill:#fff;stroke:#d7d9df;stroke-width:1.5}.number{fill:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;font-weight:700}.note{fill:#747680;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px}
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="980"/>
  <rect class="window" x="20" y="18" width="1560" height="900" rx="16" filter="url(#shadow)"/>

