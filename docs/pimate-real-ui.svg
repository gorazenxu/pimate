  <text class="muted small" x="454" y="390">updated</text>
  <text class="text small" x="586" y="390">2026/01/01</text>
  <text class="muted small" x="454" y="424">series</text>
  <text class="text small" x="586" y="424">Project A</text>
  <text class="muted small" x="454" y="458">pipeline</text>
  <text class="text small" x="586" y="458">Obsidian + Pimate</text>
  <line class="divider" x1="434" y1="494" x2="842" y2="494"/>
  <text class="text body" x="434" y="538">本周项目进展与下一步计划</text>
  <text class="muted body" x="434" y="574">项目归属：Project A</text>
  <text class="muted body" x="434" y="610">核心判断：先整理信息，再安排执行顺序</text>
  <text class="muted body" x="434" y="646">让下一步工作清晰、可追踪。</text>
  <rect class="subtle" x="434" y="690" width="408" height="100" rx="8"/>
  <text class="muted small" x="454" y="720">当前笔记可直接作为 Pimate 上下文</text>
  <text class="muted small" x="454" y="750">@ 文件 / 文件夹 / 选中文本 → 发送到右侧 Agent</text>
  <text class="muted tiny" x="434" y="862">Obsidian 编辑区：真实 Vault 内容，不是 Pimate 内置示例</text>

