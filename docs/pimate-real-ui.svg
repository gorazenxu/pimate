  <circle cx="180" cy="41" r="8" class="icon"/>
  <path class="icon" d="M186 47l6 6"/>
  <rect class="pane" x="510" y="25" width="330" height="32" rx="7"/>
  <text class="muted small" x="532" y="46">Example note – Pimate…</text>
